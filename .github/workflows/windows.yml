name: Python Windows build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.23
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Test, package and validate Windows EXE
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ExcelInsights-Python-windows-x64
          if-no-files-found: error
          path: |
            artifacts/ExcelInsights-Python-Windows-x64.zip
            artifacts/Python-SHA256SUMS.txt
            artifacts/python-smoke.json
