[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-insights"
version = "0.3.0"
description = "繁體中文 Excel 桌面統計工作台"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6-Essentials==6.8.3",
  "pandas==2.2.3",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "pyxlsb==1.0.10",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.13.0", "xlwt==1.3.0"]

[project.gui-scripts]
excel-insights = "excel_insights.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
excel_insights = ["assets/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
